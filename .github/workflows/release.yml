# Publishes the package to PyPI and creates a GitHub release when the version
# in pyproject.toml changes on main (or when a matching v<version> tag is pushed).

name: Release Python Package

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Release'

permissions:
  packages: write
  contents: write

jobs:
  check-version:
    name: Check for a new version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
    - uses: actions/checkout@v4
    - name: Compare pyproject.toml version with existing tags
      id: version
      run: |
        version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        tag="v${version}"
        echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        rc=0
        git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null || rc=$?
        case "${rc}" in
          0) echo "Version ${version} is already released as ${tag}, nothing to publish."
             echo "release=false" >> "$GITHUB_OUTPUT" ;;
          2) echo "Version ${version} has no tag yet, releasing ${tag}."
             echo "release=true" >> "$GITHUB_OUTPUT" ;;
          *) echo "::error::git ls-remote failed with exit code ${rc}"
             exit 1 ;;
        esac

  waitfortest:
    name: Wait for tests to succeed
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: lewagon/wait-on-check-action@v1.3.4
      with:
        ref: ${{ github.sha }}
        check-name: 'test'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 20

  build:
    name: Build distribution
    needs: waitfortest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/orcatools
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: Create GitHub release
    needs:
    - check-version
    - publish-to-pypi
    runs-on: ubuntu-latest
    steps:
    - name: Tag the released commit and create the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ needs.check-version.outputs.tag }}
      run: gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${TAG}" --generate-notes
